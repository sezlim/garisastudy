<!DOCTYPE html>
<html lang="ko" data-theme="light" data-font="md">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>정보시스템 감리사 · 최단기 합격 개념서</title>
  <meta
    name="description"
    content="정보시스템 감리사 13개년(2014~2026) 1,560문항과 기술사 연계 868문항을 출제 의도·핵심 개념·함정 설계·능동 회상 플래시카드로 압축한 출퇴근용 최단기 합격 개념서"
  />
  <meta name="theme-color" content="#f7f6f2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314634a'/%3E%3Cpath d='M9 22V10h7.5c2.6 0 4.5 1.4 4.5 3.8 0 2.5-1.9 4-4.5 4H12.5V22H9zm3.5-7h3.6c1 0 1.6-.5 1.6-1.3s-.6-1.3-1.6-1.3h-3.6V15z' fill='%23f7f6f2'/%3E%3C/svg%3E"
  />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="drawerBackdrop" class="drawer-backdrop hidden" aria-hidden="true"></div>

  <div class="app-layout">
    <!-- Left Navigation Rail (Desktop fixed / Mobile slide-over drawer) -->
    <aside id="topicDrawer" class="sidebar" aria-label="과목 및 토픽 탐색">
      <div class="sidebar-head">
        <div class="brand-lockup">
          <span class="brand-emblem" aria-hidden="true">합</span>
          <div class="brand-text">
            <div class="brand-title">감리사 합격 개념서</div>
            <div class="brand-sub">13개년 1,560문항 · 104토픽</div>
          </div>
        </div>
        <button id="drawerCloseBtn" class="icon-btn mobile-only" type="button" aria-label="목록 닫기">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- Global Search -->
      <div class="search-box-wrap">
        <div class="search-box">
          <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input
            id="globalSearchInput"
            class="search-input"
            type="search"
            placeholder="토픽·키워드·함정 전체 검색..."
            autocomplete="off"
            aria-label="전체 개념 및 함정 검색"
          />
          <button id="searchClearBtn" class="search-clear hidden" type="button" aria-label="검색어 지우기">×</button>
        </div>
      </div>

      <!-- 5 Subject Tabs -->
      <div id="subjectTabs" class="subject-tabs" role="tablist" aria-label="5개 과목 선택"></div>

      <!-- Priority / Mastery Filter Chips -->
      <div id="tierFilters" class="tier-filters" role="group" aria-label="우선순위 필터">
        <button class="filter-chip active" type="button" data-filter="all">전체</button>
        <button class="filter-chip" type="button" data-filter="S">S급 필수</button>
        <button class="filter-chip" type="button" data-filter="recent">최근 3년↑</button>
        <button class="filter-chip" type="button" data-filter="weak">복습·미완</button>
      </div>

      <!-- Topic List -->
      <nav id="topicList" class="topic-list" aria-label="세부 토픽 목록"></nav>

      <!-- Compact Progress Footer -->
      <div class="sidebar-footer">
        <div class="sidebar-progress-row">
          <span id="sidebarProgressLabel">전체 숙지율</span>
          <strong id="sidebarProgressPct">0%</strong>
        </div>
        <div class="mini-bar-track" aria-hidden="true">
          <div id="sidebarProgressFill" class="mini-bar-fill" style="width: 0%;"></div>
        </div>
      </div>
    </aside>

    <!-- Main Workspace Column -->
    <div class="main-column">
      <!-- Top Header -->
      <header class="topbar">
        <div class="topbar-left">
          <button id="drawerOpenBtn" class="icon-btn mobile-only" type="button" aria-label="토픽 목록 열기">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
              <line x1="4" y1="7" x2="20" y2="7"/>
              <line x1="4" y1="12" x2="20" y2="12"/>
              <line x1="4" y1="17" x2="20" y2="17"/>
            </svg>
          </button>

          <nav class="desktop-nav" role="tablist" aria-label="학습 모드 전환">
            <button class="nav-pill active" type="button" role="tab" data-view="reader" aria-selected="true">개념서</button>
            <button class="nav-pill" type="button" role="tab" data-view="commute" aria-selected="false">오늘의 10분</button>
            <button class="nav-pill" type="button" role="tab" data-view="flash" aria-selected="false">함정 플래시</button>
            <button class="nav-pill" type="button" role="tab" data-view="radar" aria-selected="false">합격 레이더</button>
          </nav>

          <span id="mobileHeaderTitle" class="mobile-title mobile-only">감리사 합격 개념서</span>
        </div>

        <div class="topbar-right">
          <button id="fontSizeBtn" class="tool-chip" type="button" title="글자 크기 변경 (출퇴근 가독성)">
            <span id="fontSizeLabel">가</span>
          </button>
          <button id="themeToggleBtn" class="icon-btn" type="button" title="라이트 / 다크 모드 전환" aria-label="테마 전환">
            <svg id="themeIconSun" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"/>
              <line x1="12" y1="1" x2="12" y2="3"/>
              <line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/>
              <line x1="21" y1="12" x2="23" y2="12"/>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
            <svg id="themeIconMoon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Scrollable Main Viewport -->
      <main id="mainScroll" class="main-scroll" aria-live="polite">
        <div id="viewRoot" class="view-container">
          <div class="loading-box">합격 개념 데이터를 불러오는 중입니다...</div>
        </div>
      </main>

      <!-- Mobile One-Thumb Bottom Navigation -->
      <nav class="mobile-bottom-nav mobile-only" aria-label="하단 학습 메뉴">
        <button class="bottom-nav-btn active" type="button" data-view="reader">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          </svg>
          <span>개념서</span>
        </button>
        <button class="bottom-nav-btn" type="button" data-view="commute">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/>
            <polyline points="12 7 12 12 15.5 14"/>
          </svg>
          <span>오늘 10분</span>
        </button>
        <button class="bottom-nav-btn" type="button" data-view="flash">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
          <span>함정 플래시</span>
        </button>
        <button class="bottom-nav-btn" type="button" data-view="radar">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="20" x2="18" y2="10"/>
            <line x1="12" y1="20" x2="12" y2="4"/>
            <line x1="6" y1="20" x2="6" y2="14"/>
          </svg>
          <span>합격 레이더</span>
        </button>
      </nav>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <!-- Offline-ready data bundle (works via file:// AND any static host) -->
  <script src="./concept_data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
