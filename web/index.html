<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AI Workspace</title>
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23171717'/%3E%3Cpath d='M16 7l2.2 6.8L25 16l-6.8 2.2L16 25l-2.2-6.8L7 16l6.8-2.2z' fill='none' stroke='%23d4d4d4' stroke-width='1.8' stroke-linejoin='round'/%3E%3C/svg%3E"
  />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="appShell" class="app-shell">
    <div id="sidebarBackdrop" class="sidebar-backdrop" aria-hidden="true"></div>

    <aside id="sidebar" class="sidebar" aria-label="워크스페이스 탐색">
      <div class="sidebar-top">
        <div class="brand-row">
          <span class="brand-mark" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
              <path d="M12 3l2.2 6.8L21 12l-6.8 2.2L12 21l-2.2-6.8L3 12l6.8-2.2z"/>
            </svg>
          </span>
          <span class="brand-name">AI Workspace</span>
        </div>
        <button id="sidebarCloseBtn" class="icon-btn sidebar-close-btn" type="button" title="사이드바 접기" aria-label="사이드바 접기">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <line x1="9" y1="4" x2="9" y2="20"/>
          </svg>
        </button>
      </div>

      <div class="subject-tabs-wrap">
        <div id="subjectTabs" class="subject-tabs" role="tablist" aria-label="요일별 과목"></div>
        <div id="subjectSubtitle" class="subject-subtitle"></div>
      </div>

      <nav id="topicList" class="topic-list" aria-label="세부 토픽 목록"></nav>

      <div class="sidebar-footer">
        <button id="dueReviewShortcutBtn" class="sidebar-footer-btn" type="button">
          <span class="footer-dot" aria-hidden="true"></span>
          <span id="sidebarStatsText">오늘 복습 0건 · 전체 0/1560</span>
        </button>
      </div>
    </aside>

    <main class="main-pane">
      <header class="top-bar">
        <div class="top-left">
          <button id="sidebarToggleBtn" class="icon-btn" type="button" title="메뉴 열기/접기" aria-label="메뉴 열기/접기">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <line x1="4" y1="7" x2="20" y2="7"/>
              <line x1="4" y1="12" x2="20" y2="12"/>
              <line x1="4" y1="17" x2="20" y2="17"/>
            </svg>
          </button>

          <div class="model-dropdown-wrap">
            <button id="filterDropdownBtn" class="model-dropdown-btn" type="button" aria-haspopup="true" aria-expanded="false">
              <span class="model-title">Audit Assistant</span>
              <span id="activeFilterBadge" class="model-subbadge"></span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </button>

            <div id="filterMenu" class="dropdown-menu hidden" role="menu" aria-label="보기 및 정렬 필터">
              <div class="dropdown-section-label">모드 필터</div>
              <div id="filterOptionsGroup" class="dropdown-group"></div>
              <div class="dropdown-divider"></div>
              <div class="dropdown-section-label">정렬 순서</div>
              <div id="sortOptionsGroup" class="dropdown-group"></div>
            </div>
          </div>
        </div>

        <div class="top-right">
          <button id="stealthBtn" class="icon-btn" type="button" title="새 대화 (Esc × 2)" aria-label="새 대화 화면 전환">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9"/>
              <path d="M16.5 3.5a2.12 2.12 0 1 1 3 3L7 19l-4 1 1-4Z"/>
            </svg>
          </button>
          <button id="settingsBtn" class="icon-btn" type="button" title="설정" aria-label="설정 열기">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09c-.66 0-1.25.4-1.51 1Z"/>
            </svg>
          </button>
        </div>
      </header>

      <section id="chatStream" class="chat-stream" aria-live="polite">
        <div id="streamInner" class="stream-inner">
          <div class="loading-state">데이터를 불러오는 중입니다...</div>
        </div>
      </section>

      <footer id="composerBar" class="composer-wrap">
        <div class="composer-box">
          <textarea
            id="memoInput"
            class="composer-input"
            rows="1"
            placeholder="메모 입력 (자동 저장)..."
            aria-label="한 줄 메모"
          ></textarea>
          <div class="composer-actions">
            <span id="memoSavedHint" class="memo-saved-hint" aria-hidden="true">저장됨</span>
            <button
              id="uncertainBtn"
              class="composer-icon-btn"
              type="button"
              title="불확실(찍음) 표시"
              aria-label="불확실(찍음) 표시"
              aria-pressed="false"
            >
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
                <line x1="4" y1="22" x2="4" y2="15"/>
              </svg>
            </button>
            <button
              id="nextBtn"
              class="composer-send-btn"
              type="button"
              title="다음 문제 (Enter)"
              aria-label="다음 문제로 이동"
            >
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"/>
                <polyline points="12 5 19 12 12 19"/>
              </svg>
            </button>
          </div>
        </div>
      </footer>
    </main>
  </div>

  <!-- Stealth Mode Overlay -->
  <div id="stealthScreen" class="stealth-screen hidden" role="dialog" aria-label="AI Workspace" aria-modal="true">
    <div class="stealth-top">
      <div class="stealth-brand">AI Workspace</div>
      <button id="stealthReturnBtn" class="icon-btn" type="button" title="이전 작업으로 복귀 (Esc × 2)" aria-label="이전 작업으로 복귀">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 14 4 9 9 4"/>
          <path d="M20 20v-7a4 4 0 0 0-4-4H4"/>
        </svg>
      </button>
    </div>
    <div class="stealth-center">
      <h1 class="stealth-heading">무엇을 도와드릴까요?</h1>
      <div class="stealth-composer">
        <input
          id="stealthInput"
          class="stealth-input"
          type="text"
          placeholder="무엇이든 물어보세요..."
          autocomplete="off"
        />
        <button id="stealthSubmitBtn" class="composer-send-btn" type="button" aria-label="전송">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"/>
            <polyline points="5 12 12 5 19 12"/>
          </svg>
        </button>
      </div>
      <div class="stealth-chips">
        <button class="stealth-chip" type="button">아키텍처 검토 요약</button>
        <button class="stealth-chip" type="button">SQL 실행계획 분석</button>
        <button class="stealth-chip" type="button">보안 점검 체크리스트</button>
        <button class="stealth-chip" type="button">주간 보고서 초안</button>
      </div>
    </div>
  </div>

  <!-- Lightbox Modal -->
  <div id="lightboxModal" class="lightbox-modal hidden" role="dialog" aria-modal="true" aria-label="이미지 확대 보기">
    <div class="lightbox-bar">
      <button id="lightboxInvertBtn" class="pill-btn" type="button">원본 색상</button>
      <button id="lightboxCloseBtn" class="icon-btn lightbox-close" type="button" aria-label="닫기">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div id="lightboxBody" class="lightbox-body">
      <img id="lightboxImg" class="lightbox-img" src="" alt="문제 확대 이미지" />
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="settingsModalTitle">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="settingsModalTitle" class="modal-title">설정</h2>
        <button id="settingsCloseBtn" class="icon-btn" type="button" aria-label="설정 닫기">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <div class="modal-body">
        <div class="setting-row">
          <div class="setting-info">
            <div class="setting-label">화면 테마</div>
            <div class="setting-desc">다크 / 라이트 모드 전환</div>
          </div>
          <div class="segmented-control">
            <button id="themeDarkBtn" class="seg-btn" type="button">다크</button>
            <button id="themeLightBtn" class="seg-btn" type="button">라이트</button>
          </div>
        </div>

        <div class="setting-row">
          <div class="setting-info">
            <div class="setting-label">다크 모드 이미지 반전</div>
            <div class="setting-desc">흰 배경 크롭 도표를 어두운 배경에 맞게 완화</div>
          </div>
          <label class="switch-label">
            <input id="defaultInvertCheckbox" type="checkbox" />
            <span class="switch-track"></span>
          </label>
        </div>

        <div class="setting-block">
          <label for="gemUrlInput" class="setting-label">Gemini Gem URL</label>
          <div class="setting-desc">미입력 시 기본 https://gemini.google.com/app 로 연결됩니다.</div>
          <div class="setting-input-row">
            <input id="gemUrlInput" class="text-input" type="url" placeholder="https://gemini.google.com/app" />
            <button id="saveGemUrlBtn" class="btn-secondary" type="button">저장</button>
          </div>
        </div>

        <div class="setting-block">
          <div class="setting-label">학습 기록 백업 및 이식 (PC ↔ 모바일)</div>
          <div id="settingsProgressMeta" class="setting-desc"></div>
          <div class="setting-btn-grid">
            <button id="exportBackupBtn" class="btn-secondary" type="button">학습기록 백업 (JSON)</button>
            <button id="importBackupBtn" class="btn-secondary" type="button">학습기록 불러오기</button>
            <button id="importAnswersBtn" class="btn-secondary" type="button">정답지 JSON 일괄 반영</button>
            <button id="resetProgressBtn" class="btn-danger-muted" type="button">전체 기록 초기화</button>
          </div>
          <input id="importBackupFile" type="file" accept=".json,application/json" hidden />
          <input id="importAnswersFile" type="file" accept=".json,application/json" hidden />
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="./app.js" defer></script>
</body>
</html>
